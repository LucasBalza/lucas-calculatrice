name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utiliser Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci
      - name: Lancer les tests backend
        working-directory: backend
        run: npm test

  frontend:
    name: Compilation frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Utiliser Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci
      - name: Compiler le frontend
        working-directory: frontend
        run: npm run build

  docker-images:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construire l'image Docker backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-backend:ci-${{ github.run_number }}
      - name: Construire l'image Docker frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-frontend:ci-${{ github.run_number }}
      - name: Connexion à Harbor
        if: ${{ secrets.HARBOR_USERNAME && secrets.HARBOR_PASSWORD }}
        uses: docker/login-action@v5
        with:
          registry: harbor.kakor.ovh
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Pousser l'image backend vers Harbor
        if: ${{ github.event_name == 'push' && (secrets.HARBOR_USERNAME && secrets.HARBOR_PASSWORD) }}
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-backend:latest
      - name: Pousser l'image frontend vers Harbor
        if: ${{ github.event_name == 'push' && (secrets.HARBOR_USERNAME && secrets.HARBOR_PASSWORD) }}
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-frontend:latest

  deploy-openshift:
    name: Déploiement OpenShift
    runs-on: ubuntu-latest
    needs:
      - docker-images
    if: ${{ github.event_name == 'push' && secrets.OPENSHIFT_SERVER && secrets.OPENSHIFT_TOKEN && secrets.OPENSHIFT_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client oc
        run: |
          sudo curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o /tmp/oc.tar.gz
          sudo tar -xzf /tmp/oc.tar.gz -C /tmp
          sudo mv /tmp/oc /usr/local/bin/oc
          oc version
      - name: Connexion à OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_SERVER }} --token=${{ secrets.OPENSHIFT_TOKEN }} --insecure-skip-tls-verify=true
      - name: Créer le projet si nécessaire
        run: |
          oc get project ${{ secrets.OPENSHIFT_PROJECT }} || \
          oc new-project ${{ secrets.OPENSHIFT_PROJECT }}
      - name: Sélectionner le projet
        run: oc project ${{ secrets.OPENSHIFT_PROJECT }}
      - name: Appliquer les manifests OpenShift
        run: |
          oc apply -f openshift/secrets.yaml
          oc apply -f openshift/mongo.yaml
          oc apply -f openshift/backend.yaml
          oc apply -f openshift/frontend.yaml
