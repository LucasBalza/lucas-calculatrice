name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Utiliser Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Installer les dépendances backend
        working-directory: backend
        run: npm ci

      - name: Lancer les tests backend
        working-directory: backend
        run: npm test

  frontend:
    name: Compilation frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Utiliser Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Compiler le frontend
        working-directory: frontend
        run: npm run build

  docker-images:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image Docker backend (CI)
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-backend:ci-${{ github.run_number }}

      - name: Construire l'image Docker frontend (CI)
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-frontend:ci-${{ github.run_number }}

      - name: Vérifier présence credentials Harbor
        id: check-harbor
        run: |
          if [ -z "$HARBOR_USERNAME" ] || [ -z "$HARBOR_PASSWORD" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Connexion à Harbor
        if: steps.check-harbor.outputs.available == 'true'
        uses: docker/login-action@v5
        with:
          registry: harbor.kakor.ovh
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Push backend (latest)
        if: github.event_name == 'push' && steps.check-harbor.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-backend:latest

      - name: Push frontend (latest)
        if: github.event_name == 'push' && steps.check-harbor.outputs.available == 'true'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: harbor.kakor.ovh/ipim2il/lucas-calculator-frontend:latest

  deploy-openshift:
    name: Déploiement OpenShift
    runs-on: ubuntu-latest
    needs:
      - docker-images

    if: github.event_name == 'push'

    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      OPENSHIFT_PROJECT: ${{ secrets.OPENSHIFT_PROJECT }}

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les variables OpenShift
        id: check-oc
        run: |
          if [ -z "$OPENSHIFT_SERVER" ] || [ -z "$OPENSHIFT_TOKEN" ] || [ -z "$OPENSHIFT_PROJECT" ]; then
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Installer le client oc
        if: steps.check-oc.outputs.available == 'true'
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz -o /tmp/oc.tar.gz
          tar -xzf /tmp/oc.tar.gz -C /tmp
          sudo mv /tmp/oc /usr/local/bin/oc
          oc version

      - name: Connexion à OpenShift
        if: steps.check-oc.outputs.available == 'true'
        run: |
          oc login $OPENSHIFT_SERVER --token=$OPENSHIFT_TOKEN --insecure-skip-tls-verify=true

      - name: Créer le projet si nécessaire
        if: steps.check-oc.outputs.available == 'true'
        run: |
          oc get project $OPENSHIFT_PROJECT || oc new-project $OPENSHIFT_PROJECT

      - name: Sélectionner le projet
        if: steps.check-oc.outputs.available == 'true'
        run: oc project $OPENSHIFT_PROJECT

      - name: Déployer les manifests
        if: steps.check-oc.outputs.available == 'true'
        run: |
          oc apply -f openshift/secrets.yaml
          oc apply -f openshift/mongo.yaml
          oc apply -f openshift/backend.yaml
          oc apply -f openshift/frontend.yaml
